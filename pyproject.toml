[project]
name = "ttppr"
version = "0.1.0"
description = "Hybrid ICD-10-CM Medical Coding Pipeline (ML/DL + RAG)"
readme = "README.md"
authors = [
    { name = "Mannan Goel", email = "mannangoel657@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.26.0",
    "chromadb>=1.5.9",
    "datasets>=2.16.0",
    "faiss-cpu>=1.7.4",
    "ipywidgets>=8.1.9",
    "langchain-groq>=1.1.3",
    "lxml>=5.1.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "sentence-transformers>=2.3.0",
    "streamlit>=1.63.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0",
    "transformers>=4.37.0",
]

[project.scripts]
ttppr = "ttppr:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
